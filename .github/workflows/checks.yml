name: Checks

# Reusable gate. Called by ci.yml (dev + PRs) and by release.yml (main), so
# the same bar is enforced before merge and before anything is published.
on:
  workflow_call:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  frontend:
    name: Frontend (lint, types, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.app.json

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

  backend:
    name: Backend (compile, import, pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install pip-audit

      - name: Compile
        run: python -m compileall -q backend

      - name: Import app
        run: python -c "from backend.main import app; print(len(app.routes), 'routes')"

      - name: pip-audit
        run: pip-audit --strict

  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v4.37.3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended

      - uses: github/codeql-action/analyze@v4.37.3
        with:
          category: /language:${{ matrix.language }}

  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  trivy-repo:
    name: Trivy (filesystem + config)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Reported to the Security tab at every severity, then gated below.
      # ignore-unfixed matches the gate: findings with no available fix are
      # noise here, not signal, and would otherwise bury the actionable ones.
      - name: Trivy scan (SARIF)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          format: sarif
          output: trivy-fs.sarif
          ignore-unfixed: true
          trivyignores: .trivyignore

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v4.37.3
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs

      - name: Fail on HIGH/CRITICAL
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
          trivyignores: .trivyignore

  docker:
    name: Docker (build, smoke test, Trivy image)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runtime
          load: true
          tags: shufflefin:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          docker run -d --name shufflefin-ci -p 8005:8005 shufflefin:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8005/ > /dev/null; then
              echo "UI served on attempt $i"
              curl -fsS -o /dev/null -w 'openapi: %{http_code}\n' http://localhost:8005/openapi.json
              docker rm -f shufflefin-ci
              exit 0
            fi
            sleep 2
          done
          echo "Container never became ready"
          docker logs shufflefin-ci
          docker rm -f shufflefin-ci
          exit 1

      - name: Trivy image scan (SARIF)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: shufflefin:ci
          format: sarif
          output: trivy-image.sarif
          ignore-unfixed: true
          trivyignores: .trivyignore

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v4.37.3
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image

      - name: Fail on HIGH/CRITICAL
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: shufflefin:ci
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
          trivyignores: .trivyignore
