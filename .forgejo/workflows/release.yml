name: Release

# main        -> :edge and :sha-<commit>      rolling build
# tag vX.Y.Z  -> :X.Y.Z, :latest, :sha-<commit>  versioned release; an existing X.Y.Z is never overwritten
# Every check from dev.yml runs again first; the image is pushed only if all of them pass.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

env:
  CHECKOUT_TOKEN: ${{ github.token }}
  APP: shufflefin

jobs:
  # ── Copied unchanged from dev.yml. ──
  frontend:
    name: Frontend (lint, types, tests, build)
    runs-on: docker
    container:
      image: docker.io/library/node:24-trixie
    steps:
      - name: Checkout
        run: |
          git config --global --add safe.directory "$PWD"
          git init -q . && git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          git -c "http.extraheader=Authorization: token $CHECKOUT_TOKEN" fetch -q --depth=1 origin "$GITHUB_SHA"
          git checkout -q FETCH_HEAD
      - name: Install
        working-directory: frontend
        run: npm ci --no-fund
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Typecheck
        working-directory: frontend
        run: npx tsc --noEmit -p tsconfig.app.json
      - name: Tests
        working-directory: frontend
        run: npm test
      - name: Build
        working-directory: frontend
        run: npm run build

  backend:
    name: Backend (compile, import, pip-audit)
    runs-on: docker
    container:
      image: docker.io/library/python:3.14-trixie    # same Debian release as the Dockerfile base
    steps:
      - name: Checkout
        run: |
          git config --global --add safe.directory "$PWD"
          git init -q . && git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          git -c "http.extraheader=Authorization: token $CHECKOUT_TOKEN" fetch -q --depth=1 origin "$GITHUB_SHA"
          git checkout -q FETCH_HEAD
      - name: Install
        run: pip install -q --root-user-action=ignore -r backend/requirements.txt pip-audit
      - name: Compile
        run: python -m compileall -q backend
      - name: Import app
        run: python -c "from backend.main import app; print(len(app.routes), 'routes')"
      - name: Dependency audit
        run: pip-audit --strict

  sast:
    name: Semgrep
    runs-on: docker
    container:
      image: docker.io/semgrep/semgrep:1.178.0
    steps:
      - name: Checkout
        run: |
          git config --global --add safe.directory "$PWD"
          git init -q . && git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          git -c "http.extraheader=Authorization: token $CHECKOUT_TOKEN" fetch -q --depth=1 origin "$GITHUB_SHA"
          git checkout -q FETCH_HEAD
      - name: Scan
        run: semgrep scan --metrics off --error --config p/default --config p/python --config p/typescript --config p/react --config p/dockerfile

  secrets:
    name: Gitleaks
    runs-on: docker
    container:
      image: docker.io/zricethezav/gitleaks:v8.30.1
    steps:
      - name: Checkout full history
        run: |
          git config --global --add safe.directory "$PWD"
          git init -q . && git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          git -c "http.extraheader=Authorization: token $CHECKOUT_TOKEN" fetch -q origin "$GITHUB_SHA"
          git checkout -q FETCH_HEAD
      - name: Scan history
        run: gitleaks git . --redact --exit-code 1

  trivy:
    name: Trivy (dependencies, secrets, config)
    runs-on: docker
    container:
      image: docker.io/aquasec/trivy:0.74.0
    steps:
      - name: Install git
        run: apk add --no-cache git
      - name: Checkout
        run: |
          git config --global --add safe.directory "$PWD"
          git init -q . && git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          git -c "http.extraheader=Authorization: token $CHECKOUT_TOKEN" fetch -q --depth=1 origin "$GITHUB_SHA"
          git checkout -q FETCH_HEAD
      - name: Scan (fail on fixable HIGH or CRITICAL)
        run: trivy fs --quiet --scanners vuln,secret,misconfig --severity HIGH,CRITICAL --ignore-unfixed --ignorefile .trivyignore --exit-code 1 .

  publish:
    name: Build, scan and publish image
    needs: [frontend, backend, sast, secrets, trivy]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: docker
    container:
      image: docker.io/library/docker:28-cli
    env:
      IMAGE: ${{ vars.DOCKERHUB_REPOSITORY }}
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - name: Install git
        run: apk add --no-cache git
      - name: Checkout
        run: |
          git config --global --add safe.directory "$PWD"
          git init -q . && git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          git -c "http.extraheader=Authorization: token $CHECKOUT_TOKEN" fetch -q --depth=1 origin "$GITHUB_SHA"
          git checkout -q FETCH_HEAD
      - name: Check configuration
        run: |
          [ -n "$IMAGE" ] || { echo "Set the DOCKERHUB_REPOSITORY Actions variable"; exit 1; }
          [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ] || { echo "Set DOCKERHUB_USERNAME and DOCKERHUB_TOKEN secrets"; exit 1; }
      - name: Work out tags
        run: |
          short=$(echo "$GITHUB_SHA" | cut -c1-12)
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
            echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "Tag $GITHUB_REF_NAME is not vMAJOR.MINOR.PATCH"; exit 1; }
            tags="$version latest sha-$short"
          else
            version="edge-$short"
            tags="edge sha-$short"
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "TAGS=$tags" >> "$GITHUB_ENV"
          echo "Publishing $IMAGE with tags: $tags"
      - name: Build
        run: >
          docker build --pull --load --target runtime
          --label org.opencontainers.image.version="$VERSION"
          --label org.opencontainers.image.revision="$GITHUB_SHA"
          --label org.opencontainers.image.source="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          -t "$APP:release-$GITHUB_RUN_NUMBER" .
      - name: Smoke test
        run: |
          docker run -d --name "$APP-release-$GITHUB_RUN_NUMBER" "$APP:release-$GITHUB_RUN_NUMBER"
          for i in $(seq 1 30); do
            if docker exec "$APP-release-$GITHUB_RUN_NUMBER" python -c "import urllib.request as u; u.urlopen('http://127.0.0.1:8005/', timeout=4); u.urlopen('http://127.0.0.1:8005/openapi.json', timeout=4)"; then
              echo "UI and OpenAPI served on attempt $i"; exit 0
            fi
            sleep 2
          done
          docker logs "$APP-release-$GITHUB_RUN_NUMBER"; exit 1
      - name: Scan image (fail on fixable HIGH or CRITICAL)
        run: |
          docker save -o image.tar "$APP:release-$GITHUB_RUN_NUMBER"
          tar -c image.tar .trivyignore | docker run --rm -i --entrypoint sh docker.io/aquasec/trivy:0.74.0 \
            -c 'mkdir /w && tar -x -C /w && trivy image --quiet --severity HIGH,CRITICAL --ignore-unfixed --ignorefile /w/.trivyignore --exit-code 1 --input /w/image.tar'
      - name: Software bill of materials
        run: >
          docker run --rm -i --entrypoint sh docker.io/aquasec/trivy:0.74.0
          -c 'cat > /tmp/image.tar && trivy image --quiet --format cyclonedx --input /tmp/image.tar' < image.tar
      - name: Sign in to Docker Hub
        run: echo "$DOCKERHUB_TOKEN" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin docker.io
      - name: Refuse to overwrite a released version
        run: |
          [ "$GITHUB_REF_TYPE" = "tag" ] || exit 0
          if docker buildx imagetools inspect "docker.io/$IMAGE:$VERSION" >/dev/null 2>&1; then
            echo "docker.io/$IMAGE:$VERSION already exists. Release a new version instead."; exit 1
          fi
      - name: Push the scanned image
        run: |
          for t in $TAGS; do
            docker tag "$APP:release-$GITHUB_RUN_NUMBER" "docker.io/$IMAGE:$t"
            docker push -q "docker.io/$IMAGE:$t"
          done
      - name: Sign out and clean up
        if: always()
        run: |
          docker logout docker.io || true
          docker rm -f "$APP-release-$GITHUB_RUN_NUMBER" || true
          docker image rm -f "$APP:release-$GITHUB_RUN_NUMBER" $(for t in $TAGS; do echo "docker.io/$IMAGE:$t"; done) 2>/dev/null || true
